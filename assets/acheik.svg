<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110">
  <defs>
    <linearGradient id="acGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="acRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="acGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14532d"/>
      <stop offset="0.5" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="110" fill="#070b24"/>
  <!-- acheik-style interlocking wave rows -->
  <g fill="none" stroke-width="7" opacity="0.9">
    <path d="M-40,30 q40,-34 80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0" stroke="url(#acGold)"/>
    <path d="M-40,58 q40,-34 80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0" stroke="url(#acRed)"/>
    <path d="M-40,86 q40,-34 80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0" stroke="url(#acGreen)"/>
  </g>
  <!-- hook dots -->
  <g fill="#fde68a" opacity="0.85">
    <circle cx="40" cy="30" r="4"/><circle cx="200" cy="30" r="4"/><circle cx="360" cy="30" r="4"/>
    <circle cx="520" cy="30" r="4"/><circle cx="680" cy="30" r="4"/><circle cx="840" cy="30" r="4"/>
    <circle cx="1000" cy="30" r="4"/><circle cx="1160" cy="30" r="4"/>
    <circle cx="120" cy="86" r="4" fill="#fca5a5"/><circle cx="280" cy="86" r="4" fill="#fca5a5"/>
    <circle cx="440" cy="86" r="4" fill="#fca5a5"/><circle cx="600" cy="86" r="4" fill="#fca5a5"/>
    <circle cx="760" cy="86" r="4" fill="#fca5a5"/><circle cx="920" cy="86" r="4" fill="#fca5a5"/>
    <circle cx="1080" cy="86" r="4" fill="#fca5a5"/>
  </g>
  <!-- shimmer sweep -->
  <g transform="skewX(-18)">
    <rect x="-260" y="-20" width="150" height="150" fill="#ffffff" opacity="0.10">
      <animateTransform attributeName="transform" type="translate" values="-260 0;1500 0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect width="1200" height="110" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="2"/>
</svg>
