<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060d1f"/><stop offset="0.55" stop-color="#0e1b3d"/><stop offset="1" stop-color="#060d1f"/>
    </linearGradient>
    <radialGradient id="cglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="csh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.13"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ctitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.55" stop-color="#38bdf8"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.55" stop-color="#38bdf8"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
<style>
      .sweep { animation: sweep 4.5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-500px) skewX(-18deg); } 60%,100% { transform: translateX(1500px) skewX(-18deg); } }
      .fbob { animation: fbob 6s ease-in-out infinite; }
      .fbob2 { animation: fbob 7s ease-in-out infinite 1.2s; }
      @keyframes fbob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-16px) rotate(4deg); } }
      .fpulse { animation: fpulse 2.4s ease-in-out infinite; }
      @keyframes fpulse { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }
      .fst { animation: fst 3s ease-in-out infinite; }
      .fst2 { animation: fst 4s ease-in-out infinite 1s; }
      @keyframes fst { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
      .pop { animation: pop 0.9s cubic-bezier(.2,.9,.3,1.4) both; }
      .pop2 { animation: pop 0.9s cubic-bezier(.2,.9,.3,1.4) 0.2s both; }
      @keyframes pop { from { opacity: 0; transform: scale(0.85) translateY(14px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      text { font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="380" rx="26" fill="url(#cbg)"/>
  <rect width="1200" height="380" rx="26" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
  <ellipse cx="950" cy="190" rx="260" ry="170" fill="url(#cglow)"/>
  <rect class="sweep" x="0" y="-40" width="220" height="460" fill="url(#csh)"/>
  <g>
    <circle class="fst" cx="330" cy="70" r="2.5" fill="#fff"/>
    <circle class="fst2" cx="620" cy="320" r="2" fill="#fff"/>
    <circle class="fst" cx="60" cy="330" r="2.5" fill="#fff"/>
    <circle class="fst2" cx="760" cy="60" r="2" fill="#fff"/>
    <circle class="fst" cx="420" cy="40" r="2" fill="#fff"/>
  </g>
  <g>
    <path class="fst" d="M0 -9 C1 -3.15 3.15 -1 9 0 C3.15 1 1 3.15 0 9 C-1 3.15 -3.15 1 -9 0 C-3.15 -1 -1 -3.15 0 -9 Z" transform="translate(150 120)" fill="#22d3ee"/>
    <path class="fst2" d="M0 -7 C1 -2.45 2.45 -1 7 0 C2.45 1 1 2.45 0 7 C-1 2.45 -2.45 1 -7 0 C-2.45 -1 -1 -2.45 0 -7 Z" transform="translate(560 300)" fill="#a5f3fc"/>
    <path class="fst" d="M0 -8 C1 -2.8 2.8 -1 8 0 C2.8 1 1 2.8 0 8 C-1 2.8 -2.8 1 -8 0 C-2.8 -1 -1 -2.8 0 -8 Z" transform="translate(1080 90)" fill="#a855f7"/>
    <path class="fst2" d="M0 -6 C1 -2.1 2.1 -1 6 0 C2.1 1 1 2.1 0 6 C-1 2.1 -2.1 1 -6 0 C-2.1 -1 -1 -2.1 0 -6 Z" transform="translate(700 330)" fill="#ffffff"/>
  </g>
  <g class="pop">
    <rect x="60" y="46" width="172" height="38" rx="19" fill="url(#cgrad)"/>
    <text x="146" y="72" text-anchor="middle" font-size="19" font-weight="800" fill="#060d1f" letter-spacing="3">✨ FEATURED</text>
  </g>
  <!-- stacked-layers + cursor art -->
  <g class="fbob">
    <rect x="872" y="150" width="200" height="46" rx="12" fill="#a855f7" opacity="0.55"/>
    <rect x="860" y="126" width="200" height="46" rx="12" fill="#38bdf8" opacity="0.75"/>
    <rect x="848" y="102" width="200" height="46" rx="12" fill="url(#cgrad)" stroke="#22d3ee" stroke-width="2"/>
    <rect class="fpulse" x="848" y="196" width="200" height="52" rx="12" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="8 7"/>
    <text x="948" y="229" text-anchor="middle" font-size="15" font-weight="800" fill="#67e8f9" letter-spacing="2">PAGES</text>
    <g class="fbob2">
      <path d="M1010 66 L1010 148 L1026 132 L1038 158 L1052 152 L1040 126 L1056 126 Z" fill="#fff" stroke="#22d3ee" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <ellipse class="fpulse" cx="948" cy="160" rx="150" ry="120" fill="url(#cglow)" opacity="0.7"/>
  </g>
  <ellipse class="fpulse" cx="990" cy="190" rx="130" ry="110" fill="url(#cglow)"/>
  <!-- title block -->
  <g class="pop2">
    <text x="60" y="178" font-size="74" font-weight="800" fill="url(#ctitle)">CursorMemo</text>
    <text x="62" y="230" font-size="27" fill="#f0f0f5">Agent Memory — open-source distro of ai-memory engine</text>
    <text x="62" y="270" font-size="21" fill="#c9c9d4">One-line install · Cursor, Claude Code, Codex ready</text>
    <text x="62" y="306" font-size="21" fill="#a1a1aa" font-family="'Noto Sans Myanmar', 'Myanmar Text', sans-serif">AI လက်ထောက် ရေရှည် မှတ်ဉာဏ်စနစ်</text>
  </g>
</svg>