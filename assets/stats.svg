<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131a45"/>
      <stop offset="1" stop-color="#0b1030"/>
    </linearGradient>
    <linearGradient id="numGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="cardGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
    <!-- card 1 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.8s" fill="freeze"/>
      <rect x="14" y="14" width="282" height="128" rx="18" fill="url(#cardBg)" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="14" y="14" width="282" height="128" rx="18" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="6" filter="url(#cardGlow)"/>
      <text x="40" y="66" font-size="30">📦</text>
      <text x="40" y="112" font-size="46" font-weight="800" fill="url(#numGrad)">127</text>
      <text x="150" y="112" font-size="17" fill="#94a3b8">Public Repos</text>
    </g>
    <!-- card 2 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.8s" begin="0.15s" fill="freeze"/>
      <rect x="312" y="14" width="282" height="128" rx="18" fill="url(#cardBg)" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="312" y="14" width="282" height="128" rx="18" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="6" filter="url(#cardGlow)"/>
      <text x="338" y="66" font-size="30">⭐</text>
      <text x="338" y="112" font-size="46" font-weight="800" fill="url(#numGrad)">1</text>
      <text x="420" y="112" font-size="17" fill="#94a3b8">Stars Earned</text>
    </g>
    <!-- card 3 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.8s" begin="0.3s" fill="freeze"/>
      <rect x="610" y="14" width="282" height="128" rx="18" fill="url(#cardBg)" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="610" y="14" width="282" height="128" rx="18" fill="none" stroke="#f472b6" stroke-opacity="0.25" stroke-width="6" filter="url(#cardGlow)"/>
      <text x="636" y="66" font-size="30">👥</text>
      <text x="636" y="112" font-size="46" font-weight="800" fill="url(#numGrad)">3</text>
      <text x="718" y="112" font-size="17" fill="#94a3b8">Followers</text>
    </g>
    <!-- card 4 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.8s" begin="0.45s" fill="freeze"/>
      <rect x="908" y="14" width="278" height="128" rx="18" fill="url(#cardBg)" stroke="#4ade80" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="908" y="14" width="278" height="128" rx="18" fill="none" stroke="#4ade80" stroke-opacity="0.25" stroke-width="6" filter="url(#cardGlow)"/>
      <text x="934" y="66" font-size="30">💻</text>
      <text x="934" y="112" font-size="40" font-weight="800" fill="url(#numGrad)">HTML</text>
      <text x="1060" y="112" font-size="17" fill="#94a3b8">Top Lang</text>
    </g>

    <!-- language bars -->
    <text x="30" y="182" font-size="16" font-weight="700" letter-spacing="3" fill="#7dd3fc">⚡ TOP LANGUAGES</text>
    <g font-size="15" fill="#cbd5e1">
      <text x="30" y="214">HTML</text>
      <rect x="190" y="200" width="0" height="16" rx="8" fill="#e34c26">
        <animate attributeName="width" values="0;940" keyTimes="0;1" dur="1.4s" begin="0.5s" fill="freeze"/>
      </rect>
      <text x="1140" y="214" text-anchor="end" fill="#94a3b8">79</text>

      <text x="30" y="242">TypeScript</text>
      <rect x="190" y="228" width="0" height="16" rx="8" fill="#3178c6">
        <animate attributeName="width" values="0;155" keyTimes="0;1" dur="1.4s" begin="0.65s" fill="freeze"/>
      </rect>
      <text x="360" y="242" fill="#94a3b8" opacity="0">13<animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.9s" fill="freeze"/></text>

      <text x="30" y="270">JavaScript</text>
      <rect x="190" y="256" width="0" height="16" rx="8" fill="#f1e05a">
        <animate attributeName="width" values="0;83" keyTimes="0;1" dur="1.4s" begin="0.8s" fill="freeze"/>
      </rect>
      <text x="288" y="270" fill="#94a3b8" opacity="0">7<animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.05s" fill="freeze"/></text>

      <text x="620" y="214">CSS</text>
      <rect x="780" y="200" width="0" height="16" rx="8" fill="#563d7c">
        <animate attributeName="width" values="0;48" keyTimes="0;1" dur="1.4s" begin="0.95s" fill="freeze"/>
      </rect>
      <text x="843" y="214" fill="#94a3b8" opacity="0">4<animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.2s" fill="freeze"/></text>

      <text x="620" y="242">Shell</text>
      <rect x="780" y="228" width="0" height="16" rx="8" fill="#89e051">
        <animate attributeName="width" values="0;36" keyTimes="0;1" dur="1.4s" begin="1.1s" fill="freeze"/>
      </rect>
      <text x="831" y="242" fill="#94a3b8" opacity="0">3<animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.35s" fill="freeze"/></text>

      <text x="620" y="270">Python</text>
      <rect x="780" y="256" width="0" height="16" rx="8" fill="#3572A5">
        <animate attributeName="width" values="0;24" keyTimes="0;1" dur="1.4s" begin="1.25s" fill="freeze"/>
      </rect>
      <text x="819" y="270" fill="#94a3b8" opacity="0">1<animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.5s" fill="freeze"/></text>
    </g>

    <!-- shimmer sweep across cards -->
    <g transform="skewX(-20)">
      <rect x="-200" y="-60" width="140" height="450" fill="#ffffff" opacity="0.06">
        <animateTransform attributeName="transform" type="translate" values="-200 0;1500 0" dur="5s" begin="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
