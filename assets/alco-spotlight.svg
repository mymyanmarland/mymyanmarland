<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0620"/><stop offset="0.55" stop-color="#1c1450"/><stop offset="1" stop-color="#0b0620"/>
    </linearGradient>
    <radialGradient id="aglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.13"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="atitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="0.6" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="awin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1545"/><stop offset="1" stop-color="#0f0c2e"/>
    </linearGradient>
    <linearGradient id="apv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
<style>
      .sweep { animation: sweep 4.5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-500px) skewX(-18deg); } 60%,100% { transform: translateX(1500px) skewX(-18deg); } }
      .fbob { animation: fbob 6s ease-in-out infinite; }
      .fbob2 { animation: fbob 7s ease-in-out infinite 1.2s; }
      @keyframes fbob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-16px) rotate(4deg); } }
      .fpulse { animation: fpulse 2.4s ease-in-out infinite; }
      @keyframes fpulse { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }
      .fst { animation: fst 3s ease-in-out infinite; }
      .fst2 { animation: fst 4s ease-in-out infinite 1s; }
      @keyframes fst { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
      .pop { animation: pop 0.9s cubic-bezier(.2,.9,.3,1.4) both; }
      .pop2 { animation: pop 0.9s cubic-bezier(.2,.9,.3,1.4) 0.2s both; }
      @keyframes pop { from { opacity: 0; transform: scale(0.85) translateY(14px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      text { font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="380" rx="26" fill="url(#abg)"/>
  <rect width="1200" height="380" rx="26" fill="none" stroke="#8b5cf6" stroke-width="2.5" opacity="0.8"/>
  <ellipse cx="950" cy="190" rx="260" ry="170" fill="url(#aglow)"/>
  <rect class="sweep" x="0" y="-40" width="220" height="460" fill="url(#ash)"/>
  <g>
    <circle class="fst" cx="330" cy="70" r="2.5" fill="#fff"/>
    <circle class="fst2" cx="620" cy="320" r="2" fill="#fff"/>
    <circle class="fst" cx="60" cy="330" r="2.5" fill="#fff"/>
    <circle class="fst2" cx="760" cy="60" r="2" fill="#fff"/>
    <circle class="fst" cx="420" cy="40" r="2" fill="#fff"/>
  </g>
  <g>
    <path class="fst" d="M0 -9 C1 -3.15 3.15 -1 9 0 C3.15 1 1 3.15 0 9 C-1 3.15 -3.15 1 -9 0 C-3.15 -1 -1 -3.15 0 -9 Z" transform="translate(150 120)" fill="#22d3ee"/>
    <path class="fst2" d="M0 -7 C1 -2.4499999999999997 2.4499999999999997 -1 7 0 C2.4499999999999997 1 1 2.4499999999999997 0 7 C-1 2.4499999999999997 -2.4499999999999997 1 -7 0 C-2.4499999999999997 -1 -1 -2.4499999999999997 0 -7 Z" transform="translate(560 300)" fill="#c4b5fd"/>
    <path class="fst" d="M0 -8 C1 -2.8 2.8 -1 8 0 C2.8 1 1 2.8 0 8 C-1 2.8 -2.8 1 -8 0 C-2.8 -1 -1 -2.8 0 -8 Z" transform="translate(1080 90)" fill="#8b5cf6"/>
    <path class="fst2" d="M0 -6 C1 -2.0999999999999996 2.0999999999999996 -1 6 0 C2.0999999999999996 1 1 2.0999999999999996 0 6 C-1 2.0999999999999996 -2.0999999999999996 1 -6 0 C-2.0999999999999996 -1 -1 -2.0999999999999996 0 -6 Z" transform="translate(700 330)" fill="#ffffff"/>
  </g>
  <g class="pop">
    <rect x="60" y="46" width="172" height="38" rx="19" fill="#7c3aed"/>
    <text x="146" y="72" text-anchor="middle" font-size="19" font-weight="800" fill="#fff" letter-spacing="3">✨ FEATURED</text>
  </g>
  <!-- builder window art -->
  <g class="fbob">
    <rect x="840" y="66" width="300" height="248" rx="16" fill="url(#awin)" stroke="#8b5cf6" stroke-width="2.5"/>
    <circle cx="866" cy="92" r="7" fill="#f87171"/><circle cx="888" cy="92" r="7" fill="#fbbf24"/><circle cx="910" cy="92" r="7" fill="#34d399"/>
    <text x="1050" y="97" text-anchor="middle" font-size="14" fill="#a5a0d8" letter-spacing="2">builder</text>
    <rect x="862" y="116" width="170" height="11" rx="5.5" fill="#a78bfa" opacity="0.85"/>
    <rect x="862" y="136" width="130" height="11" rx="5.5" fill="#67e8f9" opacity="0.7"/>
    <rect x="862" y="156" width="150" height="11" rx="5.5" fill="#a78bfa" opacity="0.55"/>
    <rect x="862" y="186" width="256" height="64" rx="10" fill="url(#apv)" opacity="0.9"/>
    <rect class="fpulse" x="862" y="262" width="120" height="30" rx="15" fill="#34d399"/>
    <text x="922" y="283" text-anchor="middle" font-size="15" font-weight="800" fill="#0b0620">PREVIEW</text>
    <text x="1075" y="150" text-anchor="middle" font-size="34" font-weight="800" fill="#22d3ee" font-family="ui-monospace, monospace">&lt;/&gt;</text>
  </g>
  <ellipse class="fpulse" cx="990" cy="190" rx="130" ry="110" fill="url(#aglow)"/>
  <!-- title block -->
  <g class="pop2">
    <text x="60" y="178" font-size="74" font-weight="800" fill="url(#atitle)">ALCO</text>
    <text x="62" y="230" font-size="27" fill="#f0f0f5">AI Lab for Code Operations</text>
    <text x="62" y="270" font-size="21" fill="#c9c9d4">Describe an app — get real code, sandboxed &amp; versioned</text>
    <text x="62" y="306" font-size="21" fill="#a1a1aa" font-family="'Noto Sans Myanmar', 'Myanmar Text', sans-serif">တွေးပါ။ တည်ဆောက်ပါ။ လွှင့်တင်ပါ။</text>
  </g>
</svg>