<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0508"/>
      <stop offset="0.55" stop-color="#7f1d2c"/>
      <stop offset="1" stop-color="#2a060b"/>
    </linearGradient>
    <radialGradient id="bglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e11d2e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e11d2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bsh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff8fa0"/>
    </linearGradient>
    <linearGradient id="blbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5c6c"/>
      <stop offset="1" stop-color="#c11124"/>
    </linearGradient>
    <style>
      .sweep { animation: sweep 4.5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-500px) skewX(-18deg); } 60%,100% { transform: translateX(1500px) skewX(-18deg); } }
      .fbob { animation: fbob 6s ease-in-out infinite; }
      .fbob2 { animation: fbob 7s ease-in-out infinite 1.2s; }
      @keyframes fbob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-16px) rotate(4deg); } }
      .fpulse { animation: fpulse 2.4s ease-in-out infinite; }
      @keyframes fpulse { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }
      .fst { animation: fst 3s ease-in-out infinite; }
      .fst2 { animation: fst 4s ease-in-out infinite 1s; }
      @keyframes fst { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
      .pop { animation: pop 0.9s cubic-bezier(.2,.9,.3,1.4) both; }
      .pop2 { animation: pop 0.9s cubic-bezier(.2,.9,.3,1.4) 0.2s both; }
      @keyframes pop { from { opacity: 0; transform: scale(0.85) translateY(14px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      text { font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bbg)"/>
  <rect width="1200" height="380" rx="26" fill="none" stroke="#e11d2e" stroke-width="2.5" opacity="0.8"/>
  <ellipse cx="960" cy="190" rx="260" ry="170" fill="url(#bglow)"/>
  <rect class="sweep" x="0" y="-40" width="220" height="460" fill="url(#bsh)"/>

  <g fill="#fff">
    <circle class="fst" cx="320" cy="70" r="2.5"/>
    <circle class="fst2" cx="620" cy="320" r="2"/>
    <circle class="fst" cx="60" cy="330" r="2.5"/>
    <circle class="fst2" cx="760" cy="60" r="2"/>
    <circle class="fst" cx="420" cy="40" r="2"/>
  </g>

  <!-- FEATURED badge -->
  <g class="pop">
    <rect x="60" y="46" width="172" height="38" rx="19" fill="#e11d2e"/>
    <text x="146" y="72" text-anchor="middle" font-size="19" font-weight="800" fill="#fff" letter-spacing="3">✨ FEATURED</text>
  </g>

  <!-- cute robot logo, floating -->
  <g transform="translate(892,78) scale(3.1)"><g class="fbob">
    <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="url(#blbg)"/>
    <ellipse cx="22" cy="12" rx="14" ry="7" fill="#ffffff" opacity="0.16"/>
    <line x1="32" y1="21" x2="32" y2="12.5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M32 13 C27.5 9.5 24 7 24 4.2 C24 2.2 25.8 1 27.8 1 C29.8 1 31.2 2.2 32 3.6 C32.8 2.2 34.2 1 36.2 1 C38.2 1 40 2.2 40 4.2 C40 7 36.5 9.5 32 13 Z" fill="#ffffff"/>
    <rect x="13" y="21" width="38" height="31" rx="14" fill="#fff8f2"/>
    <circle cx="24.5" cy="35" r="5.5" fill="#33333d"/>
    <circle cx="39.5" cy="35" r="5.5" fill="#33333d"/>
    <circle cx="26.3" cy="33.2" r="1.7" fill="#ffffff"/>
    <circle cx="41.3" cy="33.2" r="1.7" fill="#ffffff"/>
    <ellipse cx="18.3" cy="42" rx="4" ry="2.8" fill="#ff9eb0" opacity="0.85"/>
    <ellipse cx="45.7" cy="42" rx="4" ry="2.8" fill="#ff9eb0" opacity="0.85"/>
    <path d="M27.5 42.5 Q32 47.5 36.5 42.5" stroke="#33333d" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g></g>

  <!-- floating emojis -->
  <g class="fbob2"><text x="700" y="120" font-size="44" text-anchor="middle">💬</text></g>
  <g class="fbob" style="animation-delay:2s"><text x="1120" y="330" font-size="40" text-anchor="middle">🖼️</text></g>
  <g class="fbob2" style="animation-delay:.6s"><text x="120" y="330" font-size="38" text-anchor="middle">🔒</text></g>

  <!-- title block -->
  <g class="pop2">
    <text x="60" y="178" font-size="74" font-weight="800" fill="url(#btitle)">BotBox 🤖</text>
    <text x="62" y="230" font-size="27" fill="#f0f0f5">Your own AI Telegram Bot in 5 minutes</text>
    <text x="62" y="270" font-size="21" fill="#c9c9d4">34 personas · /imagine images · access control</text>
    <text x="62" y="306" font-size="21" fill="#a1a1aa">ကုဒ်မရေးတတ်လည်းရတယ် — no code needed</text>
  </g>

  <ellipse class="fpulse" cx="985" cy="180" rx="130" ry="110" fill="url(#bglow)"/>
</svg>
