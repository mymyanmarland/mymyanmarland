<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05081f"/>
      <stop offset="0.55" stop-color="#0c1340"/>
      <stop offset="1" stop-color="#1b0f4d"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="softSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>

  <!-- ambient glows -->
  <circle cx="180" cy="70" r="280" fill="url(#glowC)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.28;0.5" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="380" r="300" fill="url(#glowV)" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.25;0.45" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="60" r="150" fill="url(#glowP)" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.2;0.4" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="50" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="150" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="60" r="2.1"><animate attributeName="opacity" values="1;0.25;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="200" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="70" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="40" r="1.2"><animate attributeName="opacity" values="0.35;1;0.35" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="60" r="1.9"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="140" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="45" r="2"><animate attributeName="opacity" values="1;0.25;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="170" r="1.4"><animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="80" r="1.7"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="220" r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="300" r="1.5"><animate attributeName="opacity" values="1;0.25;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="320" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="250" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="330" r="1.3"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- perspective grid floor -->
  <g stroke="#22d3ee" stroke-width="1" opacity="0.35">
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="385" x2="1200" y2="385" opacity="0.7"/>
    <line x1="0" y1="415" x2="1200" y2="415" opacity="0.45"/>
    <line x1="0" y1="440" x2="1200" y2="440" opacity="0.25"/>
    <line x1="120" y1="360" x2="20" y2="440" opacity="0.5"/>
    <line x1="360" y1="360" x2="300" y2="440" opacity="0.5"/>
    <line x1="600" y1="360" x2="600" y2="440" opacity="0.5"/>
    <line x1="840" y1="360" x2="900" y2="440" opacity="0.5"/>
    <line x1="1080" y1="360" x2="1180" y2="440" opacity="0.5"/>
  </g>
  <rect x="0" y="360" width="1200" height="80" fill="url(#floorFade)" opacity="0.5"/>
  <rect x="0" y="358" width="1200" height="3" fill="#22d3ee" opacity="0.6" filter="url(#softSm)">
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- rotating orbit rings behind the name -->
  <g opacity="0.55">
    <circle cx="600" cy="215" r="150" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="10 14" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 600 215" to="360 600 215" dur="36s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="215" r="196" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4 18" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="360 600 215" to="0 600 215" dur="52s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="215" r="150" fill="none" stroke="#f472b6" stroke-width="1" stroke-dasharray="60 320" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 600 215" to="360 600 215" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- orbiting dots -->
  <circle cx="0" cy="0" r="5" fill="#22d3ee" filter="url(#softSm)">
    <animateMotion dur="12s" repeatCount="indefinite" path="M 750,215 A 150,150 0 1 1 749.9,215"/>
  </circle>
  <circle cx="0" cy="0" r="4" fill="#f472b6" filter="url(#softSm)">
    <animateMotion dur="20s" repeatCount="indefinite" path="M 796,215 A 196,196 0 1 0 795.9,215"/>
  </circle>
  <circle cx="0" cy="0" r="3.5" fill="#a78bfa" filter="url(#softSm)">
    <animateMotion dur="15s" repeatCount="indefinite" path="M 450,215 A 150,150 0 1 0 450.1,215"/>
  </circle>

  <!-- floating code symbols -->
  <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="700" fill="#67e8f9">
    <text x="90" y="180" font-size="34" opacity="0">&lt;/&gt;<animate attributeName="opacity" values="0;0.75;0" dur="9s" begin="0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -70" dur="9s" begin="0s" repeatCount="indefinite"/></text>
    <text x="1050" y="150" font-size="30" opacity="0">{ }<animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -80" dur="11s" begin="2s" repeatCount="indefinite"/></text>
    <text x="180" y="300" font-size="26" opacity="0" fill="#a78bfa">=&gt;<animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -60" dur="10s" begin="4s" repeatCount="indefinite"/></text>
    <text x="980" y="300" font-size="30" opacity="0" fill="#f472b6">( )<animate attributeName="opacity" values="0;0.7;0" dur="12s" begin="1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -75" dur="12s" begin="1s" repeatCount="indefinite"/></text>
    <text x="880" y="120" font-size="24" opacity="0" fill="#a78bfa">;<animate attributeName="opacity" values="0;0.75;0" dur="8s" begin="5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -55" dur="8s" begin="5s" repeatCount="indefinite"/></text>
    <text x="300" y="120" font-size="24" opacity="0" fill="#f472b6">#<animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -65" dur="10s" begin="3s" repeatCount="indefinite"/></text>
  </g>

  <!-- rising particles -->
  <g fill="#a5f3fc">
    <circle cx="420" cy="400" r="3"><animate attributeName="cy" values="400;120" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="410" r="2.5"><animate attributeName="cy" values="410;140" dur="12s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="12s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="405" r="2"><animate attributeName="cy" values="405;150" dur="9s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="5s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="400" r="3.2"><animate attributeName="cy" values="400;110" dur="13s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.75;0" dur="13s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- hero text -->
  <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="118" font-size="21" letter-spacing="7" fill="#7dd3fc" opacity="0.95">✨ WELCOME TO MY GITHUB ✨
      <animate attributeName="opacity" values="0.95;0.55;0.95" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="160" font-size="26" letter-spacing="3" fill="#e0e7ff">မင်္ဂလာပါ — I'm</text>
    <!-- glow copy -->
    <text x="600" y="248" font-size="76" font-weight="800" letter-spacing="5" fill="#22d3ee" filter="url(#soft)" opacity="0.85">KYAW MYO NAING</text>
    <text x="600" y="248" font-size="76" font-weight="800" letter-spacing="5" fill="url(#nameGrad)">KYAW MYO NAING</text>
    <text x="600" y="292" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="27" letter-spacing="2" fill="#22d3ee">@mymyanmarland
      <animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="326" font-size="20" letter-spacing="2" fill="#c4b5fd">Full-Stack Developer · AI Builder · Automation Enthusiast</text>
  </g>

  <!-- scanline sweep -->
  <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 560" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- vignette -->
  <rect width="1200" height="440" fill="none" stroke="#020617" stroke-width="10" opacity="0.6"/>
</svg>
