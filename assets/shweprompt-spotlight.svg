<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0620"/><stop offset="0.55" stop-color="#2b1a4e"/><stop offset="1" stop-color="#0b0620"/>
    </linearGradient>
    <radialGradient id="sglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ssh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.13"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="scard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1440"/><stop offset="1" stop-color="#100c2c"/>
    </linearGradient>
<style>
      .sweep { animation: sweep 4.5s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-500px) skewX(-18deg); } 60%,100% { transform: translateX(1500px) skewX(-18deg); } }
      .fbob { animation: fbob 6s ease-in-out infinite; }
      .fbob2 { animation: fbob 7s ease-in-out infinite 1.2s; }
      @keyframes fbob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-16px) rotate(4deg); } }
      .fpulse { animation: fpulse 2.4s ease-in-out infinite; }
      @keyframes fpulse { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }
      .fst { animation: fst 3s ease-in-out infinite; }
      .fst2 { animation: fst 4s ease-in-out infinite 1s; }
      @keyframes fst { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
      .pop { animation: pop 0.9s cubic-bezier(.2,.9,.3,1.4) both; }
      .pop2 { animation: pop 0.9s cubic-bezier(.2,.9,.3,1.4) 0.2s both; }
      @keyframes pop { from { opacity: 0; transform: scale(0.85) translateY(14px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      text { font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="380" rx="26" fill="url(#sbg)"/>
  <rect width="1200" height="380" rx="26" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.75"/>
  <ellipse cx="950" cy="190" rx="260" ry="170" fill="url(#sglow)"/>
  <rect class="sweep" x="0" y="-40" width="220" height="460" fill="url(#ssh)"/>
  <g>
    <circle class="fst" cx="330" cy="70" r="2.5" fill="#fff"/>
    <circle class="fst2" cx="620" cy="320" r="2" fill="#fff"/>
    <circle class="fst" cx="60" cy="330" r="2.5" fill="#fff"/>
    <circle class="fst2" cx="760" cy="60" r="2" fill="#fff"/>
    <circle class="fst" cx="420" cy="40" r="2" fill="#fff"/>
  </g>
  <g>
    <path class="fst" d="M0 -9 C1 -3.15 3.15 -1 9 0 C3.15 1 1 3.15 0 9 C-1 3.15 -3.15 1 -9 0 C-3.15 -1 -1 -3.15 0 -9 Z" transform="translate(150 120)" fill="#fbbf24"/>
    <path class="fst2" d="M0 -7 C1 -2.4499999999999997 2.4499999999999997 -1 7 0 C2.4499999999999997 1 1 2.4499999999999997 0 7 C-1 2.4499999999999997 -2.4499999999999997 1 -7 0 C-2.4499999999999997 -1 -1 -2.4499999999999997 0 -7 Z" transform="translate(540 300)" fill="#fde68a"/>
    <path class="fst" d="M0 -8 C1 -2.8 2.8 -1 8 0 C2.8 1 1 2.8 0 8 C-1 2.8 -2.8 1 -8 0 C-2.8 -1 -1 -2.8 0 -8 Z" transform="translate(1080 90)" fill="#fbbf24"/>
    <path class="fst2" d="M0 -6 C1 -2.0999999999999996 2.0999999999999996 -1 6 0 C2.0999999999999996 1 1 2.0999999999999996 0 6 C-1 2.0999999999999996 -2.0999999999999996 1 -6 0 C-2.0999999999999996 -1 -1 -2.0999999999999996 0 -6 Z" transform="translate(700 330)" fill="#ffffff"/>
  </g>
  <g class="pop">
    <rect x="60" y="46" width="172" height="38" rx="19" fill="#b45309"/>
    <text x="146" y="72" text-anchor="middle" font-size="19" font-weight="800" fill="#fff" letter-spacing="3">✨ FEATURED</text>
  </g>
  <!-- prompt card art -->
  <g class="fbob">
    <rect x="850" y="80" width="280" height="220" rx="18" fill="url(#scard)" stroke="#fbbf24" stroke-width="2.5"/>
    <rect x="878" y="104" width="110" height="28" rx="14" fill="#fbbf24"/>
    <text x="933" y="124" text-anchor="middle" font-size="16" font-weight="800" fill="#0b0620">PROMPT</text>
    <rect x="878" y="150" width="224" height="12" rx="6" fill="#fde68a" opacity="0.85"/>
    <rect x="878" y="172" width="180" height="12" rx="6" fill="#a78bfa" opacity="0.7"/>
    <rect x="878" y="194" width="205" height="12" rx="6" fill="#67e8f9" opacity="0.7"/>
    <rect x="878" y="216" width="150" height="12" rx="6" fill="#fde68a" opacity="0.5"/>
    <rect class="fpulse" x="878" y="244" width="12" height="30" rx="3" fill="#fbbf24"/>
    <g transform="translate(806 296)"><g class="fbob2">
      <line x1="0" y1="0" x2="44" y2="-64" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
      <path d="M44 -64 l0 -20 M44 -64 l-14 -14 M44 -64 l14 -14" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
      <path d="M44 -96 C45 -92 48 -91 52 -90 C48 -89 45 -88 44 -84 C43 -88 40 -89 36 -90 C40 -91 43 -92 44 -96 Z" fill="#fde68a"/>
    </g></g>
  </g>
  <ellipse class="fpulse" cx="990" cy="190" rx="130" ry="110" fill="url(#sglow)"/>
  <!-- title block -->
  <g class="pop2">
    <text x="60" y="178" font-size="74" font-weight="800" fill="url(#stitle)">ShwePrompt</text>
    <text x="62" y="230" font-size="27" fill="#f0f0f5">13 AI prompt-builder modes, one dark glass UI</text>
    <text x="62" y="270" font-size="21" fill="#c9c9d4">BYO RelayModels key — it never leaves your browser</text>
    <text x="62" y="306" font-size="21" fill="#a1a1aa">No key? Instant local prompt assembly, zero waiting</text>
  </g>
</svg>